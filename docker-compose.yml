
services:
  app:
    container_name: home-library-app
    # image: interika/nodejs-service:latest
    ports:
      - "${PORT}:${PORT}"
    build: .
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    #  args:
    #    NODE_ENV: development
    environment:
      - PORT=${PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_SECRET_REFRESH_KEY=${JWT_SECRET_REFRESH_KEY}
      - TOKEN_EXPIRE_TIME=${TOKEN_EXPIRE_TIME}
      - TOKEN_REFRESH_EXPIRE_TIME=${TOKEN_REFRESH_EXPIRE_TIME}
      - LOG_FILE_SIZE_KB=${LOG_FILE_SIZE_KB}
      - LOG_LEVEL=${LOG_LEVEL}
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./doc:/app/doc
      - ./logs:/app/logs
      - /app/node_modules
    networks:
      - home-library-network
    restart: unless-stopped
    command: npm run start:dev

  postgres:
    container_name: home-library-db
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - home-library-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres:

networks:
  home-library-network:
    driver: bridge 